; StratoSTEAM — ESP32-CAM
; Płytka: AI-Thinker ESP32-CAM. Na balonie pracuje jedna kamera.
;
; Wgranie:
;   pio run -t upload
;
; Monitor portu szeregowego:
;   pio device monitor

[platformio]
default_envs = espcam

[env:espcam]
platform      = espressif32
board         = esp32cam
framework     = arduino
monitor_speed = 115200
upload_speed  = 460800

build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue

; brak zewnętrznych bibliotek — tylko wbudowane ESP32 Arduino SDK
