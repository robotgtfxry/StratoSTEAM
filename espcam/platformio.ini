; StratoSTEAM — ESP32-CAM
; Płytka: AI-Thinker ESP32-CAM
;
; Wgraj na konkretną kamerę wybierając odpowiednie środowisko:
;   pio run -e cam0 -t upload
;   pio run -e cam1 -t upload
;   ...
;
; Monitor portu szeregowego:
;   pio device monitor -e cam0

[platformio]
default_envs = cam0

[env]
platform      = espressif32
board         = esp32cam
framework     = arduino
monitor_speed = 115200
upload_speed  = 460800

build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue

; brak zewnętrznych bibliotek — tylko wbudowane ESP32 Arduino SDK

; ── Kamera 0 ──────────────────────────────────────────────────────────────────
[env:cam0]
build_flags =
    ${env.build_flags}
    -DCAM_INDEX=0

; ── Kamera 1 ──────────────────────────────────────────────────────────────────
[env:cam1]
build_flags =
    ${env.build_flags}
    -DCAM_INDEX=1

; ── Kamera 2 ──────────────────────────────────────────────────────────────────
[env:cam2]
build_flags =
    ${env.build_flags}
    -DCAM_INDEX=2

; ── Kamera 3 ──────────────────────────────────────────────────────────────────
[env:cam3]
build_flags =
    ${env.build_flags}
    -DCAM_INDEX=3
