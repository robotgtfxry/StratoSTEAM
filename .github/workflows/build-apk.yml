name: Build APK

on:
  push:
    branches: [main, master]
    paths:
      - 'flutter/**'
      - '.github/workflows/build-apk.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'flutter/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # tworzenie Release
    env:
      # odcisk certyfikatu (nie jest tajny) — inny podpis nie może trafić do Release
      CERT_SHA256: fd4eee6cbad57027c4f4602bdee2afaf5f1668d8d106a0556a14c3bb849c1878

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.0'
          channel: stable

      - name: Get dependencies
        run: flutter pub get
        working-directory: flutter

      - name: Klucz podpisu
        id: key
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_B64: ${{ secrets.APK_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::Brak sekretu APK_KEYSTORE_BASE64 - podpis debug, bez Release"
            exit 0
          fi
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/stratosteam.p12"
          echo "path=$RUNNER_TEMP/stratosteam.p12" >> "$GITHUB_OUTPUT"

      - name: Build APK
        env:
          STRATO_KEYSTORE: ${{ steps.key.outputs.path }}
          STRATO_KEYSTORE_PASSWORD: ${{ secrets.APK_KEYSTORE_PASSWORD }}
        run: >
          flutter build apk --release
          --build-name "1.0.${{ github.run_number }}"
          --build-number "${{ github.run_number }}"
        working-directory: flutter

      - name: Usuń klucz
        if: always()
        run: rm -f "$RUNNER_TEMP/stratosteam.p12"

      - name: Sprawdź podpis
        if: steps.key.outputs.path != ''
        run: |
          SIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$SIGNER" verify --print-certs flutter/build/app/outputs/flutter-apk/app-release.apk | tee certs.txt
          grep -qi "SHA-256 digest: $CERT_SHA256" certs.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: stratosteam-release-${{ github.sha }}
          path: flutter/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Release
        if: steps.key.outputs.path != '' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp flutter/build/app/outputs/flutter-apk/app-release.apk stratosteam.apk
          gh release create "apk-1.0.${{ github.run_number }}" stratosteam.apk \
            --target "$GITHUB_SHA" --latest \
            --title "StratoSTEAM 1.0.${{ github.run_number }}" \
            --notes "Aplikacja na Androida. Adres serwera i klucz API wpisz w Ustawieniach."
